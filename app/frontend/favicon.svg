<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="128" fill="#121212" stroke="#222222" stroke-width="12"/>
  <!-- Stylized DV Monogram -->
  <g filter="url(#glow)">
    <!-- D Path -->
    <path d="M 140,140 L 250,140 C 330,140 370,180 370,256 C 370,332 330,372 250,372 L 140,372 Z" fill="none" stroke="url(#logo-grad)" stroke-width="42" stroke-linejoin="round" stroke-linecap="round" />
    <!-- V Path -->
    <path d="M 230,210 L 290,340 L 350,210" fill="none" stroke="#e0e0e0" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>
