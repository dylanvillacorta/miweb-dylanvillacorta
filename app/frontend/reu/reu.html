<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://dylanvillacorta.com/">
  <title>REU 2026 | Dylan Villacorta</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-48x48.png?v=3" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <link rel="manifest" href="/site.webmanifest?v=3">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="stylesheet" href="/styles.css?v=4">
  <link rel="stylesheet" href="/reu/styles.css?v=4">
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>
  <div class="bg-glow" aria-hidden="true"></div>

  <nav class="navbar" aria-label="Navegación principal">
    <div class="nav-container">
      <a href="/" class="nav-logo" aria-label="Dylan Villacorta, ir al inicio"><img src="/logo.svg?v=3" alt="" width="34" height="34"></a>
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
      </ul>
    </div>
  </nav>

  <main id="main" class="countdown-container">
    <p class="countdown-title">Pronto llegará</p>
    <h1 class="countdown-heading">9 de Julio de 2026</h1>

    <p class="sr-only" id="countdownSummary" role="status"></p>
    <div class="countdown-grid" aria-hidden="true">
      <div class="countdown-item">
        <div class="countdown-number" id="days">000</div>
        <div class="countdown-label">Días</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="hours">00</div>
        <div class="countdown-label">Horas</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="minutes">00</div>
        <div class="countdown-label">Minutos</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="seconds">00</div>
        <div class="countdown-label">Segundos</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="deciseconds">0</div>
        <div class="countdown-label">Décimas</div>
      </div>
    </div>

    <p class="countdown-message" id="message" role="status"></p>
  </main>

  <footer class="footer">
    <p class="footer-copy">&copy; 2026 Dylan Villacorta. Todos los derechos reservados.</p>
    <nav aria-label="Información legal" class="footer-legal">
      <a href="/privacidad">Política de Privacidad</a>
      <a href="/terminos">Términos de Uso</a>
      <a href="/accesibilidad">Accesibilidad</a>
    </nav>
  </footer>

  <script src="/reu/script.js?v=5" defer></script>
</body>
</html>
