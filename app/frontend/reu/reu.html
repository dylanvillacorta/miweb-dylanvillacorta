<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://dylanvillacorta.com/">
  <title>REU 2026 | Dylan Villacorta</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/reu/styles.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">DV</a>
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
      </ul>
    </div>
  </nav>

  <main class="countdown-container">
    <p class="countdown-title">Pronto llegará</p>
    <h1 class="countdown-heading">9 de Julio de 2026</h1>

    <div class="countdown-grid">
      <div class="countdown-item">
        <div class="countdown-number" id="days">000</div>
        <div class="countdown-label">Días</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="hours">00</div>
        <div class="countdown-label">Horas</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="minutes">00</div>
        <div class="countdown-label">Minutos</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="seconds">00</div>
        <div class="countdown-label">Segundos</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="centiseconds">00</div>
        <div class="countdown-label">Centésimas</div>
      </div>
    </div>

    <p class="countdown-message" id="message"></p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Dylan Villacorta. Todos los derechos reservados.</p>
  </footer>

  <script src="/reu/script.js?v=2" defer></script>
</body>
</html>
